[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceaudit"
version = "0.2.0"
description = "Audit AI agent traces for errors and inefficiencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
corpora = ["huggingface_hub>=0.23", "datasets>=2.20"]

[project.scripts]
traceaudit = "traceaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
